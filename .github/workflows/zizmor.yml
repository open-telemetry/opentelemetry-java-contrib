name: Zizmor

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  schedule:
    - cron: '39 8 * * 2' # weekly at 08:39 UTC on Tuesday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@03559ef555db0eae5d85c3c6347d1530243e7aa7 # v0.13.0
